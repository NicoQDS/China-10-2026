<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cina 2026</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐉</text></svg>"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <!-- All page styling lives in style.css (kept separate from markup/behavior). -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Full-screen Leaflet map — script.js fills this in (see the MAPPA section there). -->
    <div id="map"></div>

    <!-- Floating header: trip title + the three non-city panel buttons.
         Each button uses data-action="open-panel" + data-panel="<key>"
         instead of onclick — see the ACTIONS dispatch table in script.js
         for how clicks on these are handled. -->
    <div class="topbar" id="topbar">
      <div class="topbar-title">
        <h3>Cina</h3>
        <div class="sub">22 ott – 8 nov</div>
      </div>
      <div class="topbar-actions">
        <button id="btn-open-flights" data-action="open-panel" data-panel="flights">✈️</button>
        <button id="btn-open-checklist" data-action="open-panel" data-panel="checklist">✅</button>
        <button id="btn-open-money" data-action="open-panel" data-panel="money">💰</button>
      </div>
    </div>

    <!-- Map legend (bottom-left): explains the line colors and pin dots. -->
    <div class="legend" id="legend">
      <div>
        <span class="swatch" style="border-color: var(--train)"></span>Treno
        (alta velocità)
      </div>
      <div>
        <span class="swatch" style="border-color: var(--boat)"></span>Battello —
        crociera fiume Li
      </div>
      <div>
        <span class="swatch" style="border-color: var(--road)"></span>Strada
        (Didi/taxi)
      </div>
      <div>
        <span class="swatch dashed" style="border-color: var(--flight)"></span
        >Volo (interno)
      </div>
      <div>
        <span class="dot" style="background: var(--train)"></span>Tappa con
        pernottamento (clic per il programma)
      </div>
      <div>
        <span class="dot" style="background: #b08968"></span>Gita/escursione
      </div>
      <div style="font-size: 10px; color: var(--muted); margin-top: 2px">
        Foto: Wikimedia Commons
      </div>
    </div>

    <!-- Slide-out side panel. Always present in the DOM (never re-created) —
         openPanel()/closePanel() in script.js just fill #panel-body with the
         right city's HTML and toggle the "open" CSS class to slide it in/out. -->
    <div class="panel" id="panel">
      <div class="panel-head" id="panel-head">
        <div>
          <h2 id="panel-title"></h2>
          <div class="dates" id="panel-dates"></div>
        </div>
        <button class="panel-close" id="panel-close-btn" data-action="close-panel">✕</button>
      </div>
      <div class="panel-body" id="panel-body"></div>
    </div>

    <!-- Quote-request popup: lets you copy a pre-written Beijing tour
         quote-request message. Opened via the ✉️ button inside the Beijing
         panel's "Guida" section (data-action="open-quote-modal").
         Clicking the dark backdrop (but not the box itself) closes it —
         that specific "only if you clicked the backdrop" logic lives in
         script.js rather than a data-action, since it needs to compare
         the click target to this element itself. -->
    <div class="modal-overlay" id="quote-modal">
      <div class="modal-box" id="quote-modal-box">
        <div class="modal-head">
          <b>Richiesta preventivo</b>
          <button class="panel-close" id="quote-modal-close-btn" data-action="close-quote-modal">✕</button>
        </div>
        <textarea id="quote-text" readonly></textarea>
        <div class="modal-actions">
          <button class="mini-btn" id="quote-copy-btn" data-action="copy-quote-text">
            📋 Copia testo
          </button>
        </div>
      </div>
    </div>

    <!-- Leaflet library (map engine), then our own code. script.js expects
         all the HTML above to already exist, so it's loaded last, right
         before </body>. -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
  </body>
</html>
